<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="640" height="360" fill="none">
  <title>Optical Centering Guide Overlay</title>
  
  <!-- Left: Before (Geometric) -->
  <g transform="translate(20, 20)">
    <rect width="120" height="120" rx="33.75" fill="#f5c84b"/>
    <!-- Glyph Before (shifted left by uncompensated weight) -->
    <path d="M 64.7 33.75 L 45.9 33.75 A 22.5 22.5 0 0 0 23.4 56.25 L 23.4 63.75 A 22.5 22.5 0 0 0 45.9 86.25 L 64.7 86.25 A 11.25 11.25 0 0 0 75.9 75.0 L 75.9 63.75 L 89.1 63.75" 
          stroke="#253142" stroke-width="11.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 77.8 52.5 L 89.1 63.75 L 77.8 75.0" 
          stroke="#253142" stroke-width="11.25" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Geometric Center Crosshair (Red) -->
    <line x1="60" y1="0" x2="60" y2="120" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Glyph Bounding Box (Cyan) -->
    <rect x="17.8" y="28.1" width="77.0" height="63.8" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="2 2"/>
    
    <text x="60" y="136" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#253142">BEFORE: Geometric Center</text>
    <text x="60" y="148" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#dc2626">Heavy left spine shifts weight left</text>
  </g>

  <!-- Right: After (Optically Centered) -->
  <g transform="translate(180, 20)">
    <rect width="120" height="120" rx="33.75" fill="#f5c84b"/>
    <!-- Glyph After (Optically centered + open aperture) -->
    <path d="M 68.4 33.75 L 49.7 33.75 A 22.5 22.5 0 0 0 27.2 56.25 L 27.2 63.75 A 22.5 22.5 0 0 0 49.7 86.25 L 68.4 86.25 A 11.25 11.25 0 0 0 79.7 75.0 L 79.7 63.75 L 92.8 63.75" 
          stroke="#253142" stroke-width="11.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 81.6 52.5 L 92.8 63.75 L 81.6 75.0" 
          stroke="#253142" stroke-width="11.25" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Optical Center Crosshair (Green) -->
    <line x1="60" y1="0" x2="60" y2="120" stroke="#277254" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#277254" stroke-width="1.5"/>

    <!-- Optical Center Target Circle -->
    <circle cx="60" cy="60" r="16" fill="none" stroke="#277254" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Open Aperture Measure Guide -->
    <line x1="92.8" y1="33.75" x2="92.8" y2="63.75" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="88" y1="33.75" x2="96" y2="33.75" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="88" y1="63.75" x2="96" y2="63.75" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="100" y="52" font-family="'DM Sans', sans-serif" font-size="8" font-weight="700" fill="#7c3aed">Gap: 16px</text>

    <text x="60" y="136" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#253142">AFTER: Optically Centered</text>
    <text x="60" y="148" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#277254">+1.0px shift balances visual mass</text>
  </g>
</svg>